name: Deploy Route Runner
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: dev
        type: choice
        options: [dev, prod]
permissions:
  contents: read
concurrency:
  group: route-runner-${{ github.event_name == 'pull_request' && 'dev' || github.event_name == 'push' && 'prod' || inputs.environment }}
  cancel-in-progress: false
env:
  TF_IN_AUTOMATION: 'true'
jobs:
  target:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      active: ${{ steps.target.outputs.active }}
    steps:
      - id: target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REQUESTED_ENV: ${{ inputs.environment }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            echo 'environment=dev' >> "$GITHUB_OUTPUT"
            state="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .state)"
            echo "active=$([[ "$state" == open ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          else
            environment=prod
            if [[ "$EVENT" == workflow_dispatch ]]; then environment="$REQUESTED_ENV"; fi
            [[ "$environment" == dev || "$environment" == prod ]]
            echo "environment=$environment" >> "$GITHUB_OUTPUT"
            echo 'active=true' >> "$GITHUB_OUTPUT"
          fi
  plan:
    needs: target
    if: needs.target.outputs.active == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.target.outputs.environment }}-plan
    timeout-minutes: 30
    env:
      TF_DIR: infrastructure/terraform/environments/${{ needs.target.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      - uses: ./.github/actions/deploy
        with:
          google-maps-api-key: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      - name: Plan and render for review
        run: |
          terraform -chdir="$TF_DIR" init -input=false
          terraform -chdir="$TF_DIR" plan -input=false -out=reviewed.tfplan
          terraform -chdir="$TF_DIR" show -no-color reviewed.tfplan > "$TF_DIR/reviewed-plan.txt"
          mkdir release
          cp "$TF_DIR/reviewed.tfplan" "$TF_DIR/reviewed-plan.txt" "$TF_DIR/.terraform/routes-api.zip" release/
          cp -R infrastructure/frontend/dist release/frontend
          echo 'Review the reviewed-plan artifact before approving deployment.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-release-${{ github.sha }}
          path: release/
          retention-days: 30
  deploy:
    needs: [target, plan]
    runs-on: ubuntu-latest
    # Configure required reviewers here before dispatching this workflow.
    environment: ${{ needs.target.outputs.environment }}
    timeout-minutes: 45
    env:
      TF_DIR: infrastructure/terraform/environments/${{ needs.target.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-release-${{ github.sha }}
          path: release
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.3'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      - name: Apply exact reviewed plan
        run: |
          terraform -chdir="$TF_DIR" init -input=false
          cp release/routes-api.zip "$TF_DIR/.terraform/routes-api.zip"
          cp release/reviewed.tfplan "$TF_DIR/reviewed.tfplan"
          terraform -chdir="$TF_DIR" apply -input=false reviewed.tfplan
      - name: Publish assets first and HTML last
        run: |
          frontend_bucket="$(terraform -chdir="$TF_DIR" output -raw portal_bucket)"
          distribution_id="$(terraform -chdir="$TF_DIR" output -raw cloudfront_distribution_id)"
          aws s3 sync release/frontend/ "s3://${frontend_bucket}/" --exclude index.html --cache-control 'public,max-age=31536000,immutable'
          aws s3 cp release/frontend/index.html "s3://${frontend_bucket}/index.html" --cache-control 'no-cache,max-age=0,must-revalidate' --content-type 'text/html'
          aws cloudfront create-invalidation --distribution-id "$distribution_id" --paths / /index.html
