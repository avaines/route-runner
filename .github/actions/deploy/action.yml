name: Build and check application
description: Reproducible local checks and deployment artifacts; does not deploy
inputs:
  google-maps-api-key:
    description: Restricted public Google Maps browser key
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22.22.0'
        cache: npm
        cache-dependency-path: |
          infrastructure/frontend/package-lock.json
          infrastructure/lambdas/package-lock.json
    - shell: bash
      run: |
        npm --prefix infrastructure/lambdas ci
        npm --prefix infrastructure/lambdas run typecheck
        npm --prefix infrastructure/lambdas test
        npm --prefix infrastructure/lambdas run build
        npm --prefix infrastructure/frontend ci
        npm --prefix infrastructure/frontend run lint
        npm --prefix infrastructure/frontend test
        npm --prefix infrastructure/frontend run build
      env:
        VITE_GOOGLE_MAPS_API_KEY: ${{ inputs.google-maps-api-key }}
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: '1.14.3'
    - shell: bash
      run: |
        terraform fmt -check -recursive infrastructure/terraform
        terraform -chdir=infrastructure/terraform/environments/dev init -backend=false -input=false
        terraform -chdir=infrastructure/terraform/environments/dev validate
